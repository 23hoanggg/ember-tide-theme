# Cargo manifest for the parser sample
[package]
name = "ember-parser"
version = "0.3.1"
edition = "2021"
authors = ["Hoang <hoang@example.com>"]
description = """
A tiny expression tokenizer.
Multi-line "basic" string.\tTabbed.
"""
license = 'MIT OR Apache-2.0'
readme = 'README.md'
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"], default-features = false }
regex = "1.10"
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true

[features]
default = ["std"]
std = []
simd = ["dep:wide"]

[[bin]]
name = "ember"
path = "src/main.rs"

[[bench]]
name = "lexer"
harness = false

[package.metadata.limits]
max_depth = 0x40
mask = 0o755
flags = 0b1010
ratio = 1.5e-3
big = 1_000_000
inf_value = inf
nan_value = -nan
released = 2026-11-23T10:00:00Z
local_date = 2026-11-23
local_time = 07:32:00
"quoted.key" = 'literal\n'
dotted.key.path = [1, 2.5, "three", true]
inline = { x = 1, y = -2 }
