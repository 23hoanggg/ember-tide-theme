; config.ini — application settings
# hash comments work too

[server]
host = 127.0.0.1
port = 8080
debug = false
timeout = 30.5
name = "Ember API"
banner = 'single quoted'

[database]
url = postgres://user:secret@localhost:5432/app?sslmode=disable
pool_size = 10
retries = 0x3

[paths]
data = /var/lib/ember
logs = ${data}/logs
temp = C:\Temp\ember

[features.experimental]
enabled = yes
list = alpha, beta, gamma
